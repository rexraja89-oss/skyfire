<title>Skyfire Squadron</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;600;700&display=swap">
<style>
/* Layout: one full-height arcade cabinet; canvas letterboxed in the middle, menus slide over it. Single dark look by choice. */
:root{
  --night:#0d1624; --panel:#152235; --line:#2a3c57;
  --saffron:#ff9d2e; --teal:#2bb3a8; --ink:#eef3f6; --dim:#8da0b6; --danger:#ff4d6d;
  --display:'Bungee',Impact,'Arial Black',sans-serif;
  --ui:'Chakra Petch','Trebuchet MS',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--night);color:var(--ink);font-family:var(--ui);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:relative;height:100%;display:grid;place-items:center}
canvas{display:block;border-radius:6px;box-shadow:0 0 0 1px var(--line)}
button{font-family:var(--ui);font-weight:700;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.7em 1em;font-size:15px;cursor:pointer}
button:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
button:active{transform:translateY(1px)}
.primary{background:var(--saffron);color:#1b1206;border-color:var(--saffron)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;background:rgba(9,15,25,.72);overflow-y:auto}
.box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.title{font-family:var(--display);font-size:52px;line-height:.9;color:var(--saffron);text-align:center;text-shadow:0 4px 0 #8a3f00;letter-spacing:1px}
.sub{text-align:center;color:var(--dim);letter-spacing:.25em;text-transform:uppercase;font-size:12px;margin-top:-6px}
.bank{display:flex;justify-content:center;align-items:center;gap:8px;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.cog{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,var(--night) 30%,var(--saffron) 32%);box-shadow:0 0 0 3px var(--saffron) inset}
.stages{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stage{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:.75em .8em}
.stage small{color:var(--dim);font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.stage .badges{font-size:12px;letter-spacing:2px;color:var(--saffron)}
.stage[disabled]{opacity:.35;cursor:not-allowed}
.row{display:flex;gap:10px}.row>*{flex:1}
h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px;color:var(--saffron)}
.up{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.up b{font-size:15px}.up p{margin:0;color:var(--dim);font-size:12px;grid-column:1}
.pips{display:flex;gap:3px;grid-column:1}.pips i{width:14px;height:6px;border-radius:2px;background:var(--line)}.pips i.on{background:var(--teal)}
.up button{grid-column:2;grid-row:1/4;min-width:92px;padding:.55em .6em;font-variant-numeric:tabular-nums}
.up button[disabled]{opacity:.4}
.workshop{border:1px dashed var(--teal);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.workshop h3{margin:0;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--teal)}
.workshop .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.workshop button{font-size:13px;padding:.6em .5em}
.toggle.on{background:var(--teal);color:#062421;border-color:var(--teal)}
#hud{position:absolute;inset:0;pointer-events:none}
#hudTop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:10px 12px}
#hpWrap{flex:1;height:10px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden}
#hp{height:100%;width:100%;background:var(--teal);transition:width .15s}
#hudGears{display:flex;gap:6px;align-items:center;font-weight:700;font-variant-numeric:tabular-nums;min-width:64px}
#hud button{pointer-events:auto}
#pauseBtn{padding:.35em .7em;font-size:14px}
#bombBtn{position:absolute;right:14px;bottom:16px;width:68px;height:68px;border-radius:50%;padding:0;background:rgba(255,77,109,.85);border-color:var(--danger);font-size:12px;line-height:1.1}
#bombBtn span{display:block;font-family:var(--display);font-size:20px}
.stat{display:flex;justify-content:space-between;background:var(--panel);border-radius:10px;padding:10px 12px;font-variant-numeric:tabular-nums}
.stat span{color:var(--dim)}
.medal{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;border:1px solid var(--line)}
.medal.got{border-color:var(--saffron);color:var(--saffron)}
.medal.new::after{content:'NEW';margin-left:auto;font-size:11px;background:var(--saffron);color:#1b1206;border-radius:4px;padding:2px 6px}
.hint{color:var(--dim);font-size:12px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <canvas id="game" aria-label="Game area"></canvas>

  <div id="hud" hidden>
    <div id="hudTop">
      <div id="hpWrap"><div id="hp"></div></div>
      <div id="hudGears"><i class="cog"></i><span id="hudG">0</span></div>
      <button id="pauseBtn" aria-label="Pause">II</button>
    </div>
    <button id="bombBtn" aria-label="Drop shock bomb"><span id="bombN">1</span>BOMB</button>
  </div>

  <section id="menu" class="screen">
    <div class="box">
      <div class="title">SKY<br>FIRE</div>
      <div class="sub">Rex Squadron</div>
      <div class="bank"><i class="cog"></i><span id="bankG">0</span></div>
      <div class="stages" id="stageList"></div>
      <button class="primary" id="toHangar">Hangar &amp; Upgrades</button>
      <p class="hint">Drag anywhere to fly. Guns fire on their own. Arrow keys work on desktop.</p>
    </div>
  </section>

  <section id="hangar" class="screen" hidden>
    <div class="box">
      <div class="row" style="align-items:center"><h2>Hangar</h2><div class="bank" style="justify-content:flex-end"><i class="cog"></i><span id="bankG2">0</span></div></div>
      <div id="upList" style="display:flex;flex-direction:column;gap:8px"></div>
      <div class="workshop">
        <h3>Rex's Workshop</h3>
        <div class="grid">
          <button id="wGears">+10,000 gears</button>
          <button id="wMax">Max all upgrades</button>
          <button id="wUnlock">Unlock all stages</button>
          <button id="wGod" class="toggle">Invincible: off</button>
        </div>
        <button id="wReset">Reset all progress</button>
      </div>
      <button class="primary" id="hangarBack">Back to stages</button>
    </div>
  </section>

  <section id="pause" class="screen" hidden>
    <div class="box">
      <h2 style="text-align:center">Paused</h2>
      <button class="primary" id="resume">Resume</button>
      <button id="quit">Leave stage (keep gears)</button>
    </div>
  </section>

  <section id="result" class="screen" hidden>
    <div class="box">
      <h2 id="resTitle" style="text-align:center">Stage clear</h2>
      <div class="stat"><span>Gears collected</span><b id="resG">0</b></div>
      <div class="stat"><span>Enemies downed</span><b id="resK">0%</b></div>
      <div id="resMedals" style="display:flex;flex-direction:column;gap:6px"></div>
      <div class="row"><button id="resHangar">Hangar</button><button class="primary" id="resNext">Next stage</button></div>
      <button id="resMenu">Stage list</button>
    </div>
  </section>
</div>

<script>
(()=>{
const W=400,H=720,STAGE_LEN=62,MAXL=8;
const STAGES=[
 {name:'Salt Flats',   g:['#cbbd9b','#b7a681','#e2d7bb'], dec:['patch','rock']},
 {name:'Monsoon Coast',g:['#2c6a80','#4c7a46','#6a9a5a'], dec:['island','patch']},
 {name:'Rust Refinery',g:['#4f4338','#7a4a2c','#8c8c86'], dec:['tank','pipe','patch']},
 {name:'Glass Dunes',  g:['#d3a264','#bd8748','#e8c48c'], dec:['patch','rock']},
 {name:'Storm Anchorage',g:['#1f3349','#3a556e','#56728c'], dec:['island','pipe']},
 {name:'Iron Citadel', g:['#353a42','#4d535d','#6c7380'], dec:['tank','pipe','block']},
];
const UP=[
 {k:'cannon',name:'Main Cannon',desc:'More streams, harder hits',base:120},
 {k:'wing',name:'Wing Guns',desc:'Angled fire from both wings',base:200},
 {k:'missile',name:'Homing Missiles',desc:'Seek the nearest target',base:320},
 {k:'shield',name:'Armour Plating',desc:'+25 hull per level',base:150},
 {k:'magnet',name:'Gear Magnet',desc:'Pull gears from further away',base:90},
 {k:'bomb',name:'Shock Bombs',desc:'+1 bomb per sortie',base:260},
];
const MEDALS=[['clear','Stage cleared'],['untouched','No damage taken'],['hunter','90% enemies downed']];
const cost=(u,l)=>Math.round(u.base*Math.pow(1.55,l));

// ---------- save ----------
const KEY='skyfire-rex-v1';
const fresh=()=>({gears:0,unlocked:1,god:false,lv:{cannon:0,wing:0,missile:0,shield:0,magnet:0,bomb:0},medals:{}});
let save=fresh();
try{const d=JSON.parse(localStorage.getItem(KEY));if(d){save=Object.assign(fresh(),d);save.lv=Object.assign(fresh().lv,d.lv||{});save.medals=d.medals||{};}}catch(e){}
const store=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}};

// ---------- canvas ----------
const app=document.getElementById('app'),cv=document.getElementById('game'),cx=cv.getContext('2d');
let scale=1;
function resize(){const r=app.getBoundingClientRect();const s=Math.min(r.width/W,r.height/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px';const d=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(W*s*d);cv.height=Math.round(H*s*d);scale=s*d;}
addEventListener('resize',resize);resize();

const $=id=>document.getElementById(id);
const screens=['menu','hangar','pause','result'];
function show(name){screens.forEach(s=>$(s).hidden=s!==name);$('hud').hidden=!(name==='play'||name==='pause');}
const fmt=n=>Math.floor(n).toLocaleString('en-US');

// ---------- background ----------
let bg={si:0,decor:[],y:0};
function rnd(a,b){return a+Math.random()*(b-a)}
function addDecor(y){const st=STAGES[bg.si];const t=st.dec[Math.floor(Math.random()*st.dec.length)];
 bg.decor.push({t,x:rnd(-20,W+20),y,w:rnd(40,130),h:rnd(30,110),r:rnd(0,Math.PI),c:st.g[1+Math.floor(Math.random()*2)]});}
function setBg(si){bg={si,decor:[],y:0};for(let y=-100;y<H+100;y+=55)addDecor(y);bg.decor.sort((a,b)=>(a.t==='patch'?0:1)-(b.t==='patch'?0:1));}
function stepBg(dt,spd){bg.y+=spd*dt;for(const d of bg.decor)d.y+=spd*dt;bg.decor=bg.decor.filter(d=>d.y<H+160);while(bg.decor.length<16)addDecor(rnd(-200,-60));}
function drawBg(){
 const st=STAGES[bg.si];cx.fillStyle=st.g[0];cx.fillRect(0,0,W,H);
 cx.strokeStyle='rgba(0,0,0,.06)';cx.lineWidth=1;const o=bg.y%48;
 for(let y=o-48;y<H;y+=48){cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke();}
 for(const d of bg.decor){cx.save();cx.translate(d.x,d.y);
  if(d.t==='patch'){cx.globalAlpha=.55;cx.fillStyle=d.c;cx.rotate(d.r);cx.beginPath();cx.ellipse(0,0,d.w,d.h*.5,0,0,7);cx.fill();}
  else if(d.t==='island'){cx.fillStyle='#e3d39a';cx.beginPath();cx.ellipse(0,0,d.w*.6+6,d.h*.4+6,d.r,0,7);cx.fill();cx.fillStyle=st.g[2];cx.beginPath();cx.ellipse(0,0,d.w*.6,d.h*.4,d.r,0,7);cx.fill();}
  else if(d.t==='rock'){cx.fillStyle='rgba(0,0,0,.18)';cx.beginPath();cx.ellipse(4,4,d.w*.18,d.w*.12,d.r,0,7);cx.fill();cx.fillStyle=d.c;cx.beginPath();cx.ellipse(0,0,d.w*.18,d.w*.12,d.r,0,7);cx.fill();}
  else if(d.t==='tank'){const r=d.w*.28+8;cx.fillStyle='rgba(0,0,0,.25)';cx.beginPath();cx.arc(5,5,r,0,7);cx.fill();cx.fillStyle='#9aa0a4';cx.beginPath();cx.arc(0,0,r,0,7);cx.fill();cx.strokeStyle='#6d7276';cx.lineWidth=3;cx.beginPath();cx.arc(0,0,r*.65,0,7);cx.stroke();cx.fillStyle='#b5582c';cx.fillRect(-r*.2,-r*.2,r*.4,r*.4);}
  else if(d.t==='pipe'){cx.rotate(d.r>1.5?Math.PI/2:0);cx.fillStyle='rgba(0,0,0,.25)';cx.fillRect(-d.w+3,3,d.w*2,9);cx.fillStyle='#8a8f93';cx.fillRect(-d.w,0,d.w*2,9);cx.fillStyle='#c4c9cc';cx.fillRect(-d.w,1,d.w*2,2);}
  else if(d.t==='block'){cx.fillStyle='rgba(0,0,0,.3)';cx.fillRect(-d.w*.3+6,-d.h*.3+6,d.w*.6,d.h*.6);cx.fillStyle=d.c;cx.fillRect(-d.w*.3,-d.h*.3,d.w*.6,d.h*.6);cx.strokeStyle='rgba(255,255,255,.12)';cx.strokeRect(-d.w*.3+4,-d.h*.3+4,d.w*.6-8,d.h*.6-8);}
  cx.restore();}
 // cloud shadows
 cx.fillStyle='rgba(255,255,255,.05)';for(let i=0;i<3;i++){const y=((bg.y*1.6+i*300)%(H+300))-150;cx.beginPath();cx.ellipse((i*137)%W,y,120,40,0,0,7);cx.fill();}
}

// ---------- run ----------
let G=null,state='menu';
const keys={};
function startRun(si){
 const L=save.lv,mhp=100+25*L.shield;
 setBg(si);
 G={si,t:0,p:{x:W/2,y:H-120,hp:mhp,max:mhp,inv:0,fc:0,wc:0,mc:0},bombs:1+L.bomb,pb:[],eb:[],en:[],gears:[],parts:[],
   spawnT:1.5,spawned:0,killed:0,hits:0,earned:0,boss:null,bossSpawned:false,endT:-1,win:false,flash:0,shake:0};
 updHud();show('play');state='play';
}
const mult=()=>1+0.5*G.si;
function addEnemy(type,o){
 const base={dart:[3,14,1],weaver:[4,15,1],turret:[10,16,3],heavy:[32,30,8]}[type];
 const e=Object.assign({type,hp:base[0]*mult(),r:base[1],g:base[2],t:0,fire:rnd(.5,1.6),flash:0,ang:Math.PI/2},o);
 G.en.push(e);G.spawned++;}
function spawnWave(){
 const s=G.si,p=Math.random();
 if(p<.34){const left=Math.random()<.5,n=4+Math.floor(s/2);for(let i=0;i<n;i++)addEnemy('dart',{x:left?50+i*22:W-50-i*22,y:-30-i*42,vx:(left?1:-1)*35,vy:150+s*8});}
 else if(p<.6){const n=3+Math.floor(s/2),x0=90+Math.random()*220;for(let i=0;i<n;i++)addEnemy('weaver',{x:x0,x0,y:-30-i*48,ph:i*.8});}
 else if(p<.82){addEnemy('turret',{x:rnd(40,W-40),y:-30});if(s>=2)addEnemy('turret',{x:rnd(40,W-40),y:-110});}
 else addEnemy('heavy',{x:rnd(80,W-80),y:-50,ty:rnd(110,200)});
}
function spawnBoss(){const hp=280*(1+0.7*G.si);G.boss={x:W/2,y:-120,hp,max:hp,t:0,pat:0,pt:0,flash:0,dead:false};G.bossSpawned=true;}
function eShot(x,y,a,spd){G.eb.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd});}
const aimAt=(x,y)=>Math.atan2(G.p.y-y,G.p.x-x);
function boom(x,y,n,col,spd=160){for(let i=0;i<n;i++){const a=Math.random()*7,s=Math.random()*spd;G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(.3,.8),m:.8,c:col||(Math.random()<.5?'#ffb347':'#ff6a3d'),r:rnd(2,5)});}}
function dropGears(x,y,n){for(let i=0;i<n;i++)G.gears.push({x:x+rnd(-12,12),y:y+rnd(-12,12),vx:rnd(-60,60),vy:rnd(-90,-20),v:1+G.si});}
function hurtPlayer(d){if(save.god||G.p.inv>0||G.endT>=0)return;G.p.hp-=d;G.p.inv=.9;G.hits++;G.shake=.3;boom(G.p.x,G.p.y,10,'#ffffff',120);
 if(G.p.hp<=0){G.p.hp=0;boom(G.p.x,G.p.y,50);G.endT=1.6;G.win=false;}updHud();}
function bomb(){if(state!=='play'||G.bombs<=0||G.endT>=0)return;G.bombs--;G.flash=.5;G.shake=.5;
 G.eb.forEach(b=>boom(b.x,b.y,2,'#ffffff',40));G.eb=[];
 for(const e of G.en)e.hp-=40*mult();
 if(G.boss&&!G.boss.dead&&G.boss.y>0)G.boss.hp-=G.boss.max*.08;updHud();}

function update(dt){
 const p=G.p,L=save.lv;G.t+=dt;stepBg(dt,60);
 if(G.flash>0)G.flash-=dt;if(G.shake>0)G.shake-=dt;if(p.inv>0)p.inv-=dt;
 // keyboard
 const kx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),ky=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);
 p.x+=kx*300*dt;p.y+=ky*300*dt;p.x=Math.max(18,Math.min(W-18,p.x));p.y=Math.max(60,Math.min(H-30,p.y));
 const alive=p.hp>0;
 // fire
 if(alive&&G.endT<0){
  p.fc-=dt;if(p.fc<=0){p.fc=.11;const n=1+Math.floor(L.cannon/2),dmg=1+.35*L.cannon;for(let i=0;i<n;i++){const off=(i-(n-1)/2)*9;G.pb.push({x:p.x+off,y:p.y-22,vx:off*2,vy:-720,d:dmg,k:'c'});}}
  if(L.wing>0){p.wc-=dt;if(p.wc<=0){p.wc=.22;for(const s of[-1,1])G.pb.push({x:p.x+s*16,y:p.y,vx:s*170,vy:-640,d:.6+.3*L.wing,k:'w'});}}
  if(L.missile>0){p.mc-=dt;if(p.mc<=0){p.mc=Math.max(.35,1.1-.09*L.missile);for(const s of[-1,1])G.pb.push({x:p.x+s*10,y:p.y+4,vx:s*120,vy:-120,d:3+L.missile,k:'m',t:0});}}
 }
 // spawns
 if(G.t<STAGE_LEN){G.spawnT-=dt;if(G.spawnT<=0){spawnWave();G.spawnT=Math.max(.9,2.3-.15*G.si)*rnd(.8,1.2);}}
 else if(!G.bossSpawned&&(G.en.length===0||G.t>STAGE_LEN+5))spawnBoss();
 // player bullets
 for(const b of G.pb){
  if(b.k==='m'){b.t+=dt;let tg=null,best=1e9;const all=G.boss&&!G.boss.dead&&G.boss.y>0?G.en.concat([G.boss]):G.en;
   for(const e of all){const d=(e.x-b.x)**2+(e.y-b.y)**2;if(d<best&&e.y>-20){best=d;tg=e;}}
   const sp=Math.min(560,140+b.t*900);let a=Math.atan2(b.vy,b.vx);
   if(tg&&b.t>.12){const want=Math.atan2(tg.y-b.y,tg.x-b.x);let da=want-a;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;a+=Math.max(-7*dt,Math.min(7*dt,da));}
   b.vx=Math.cos(a)*sp;b.vy=Math.sin(a)*sp;if(Math.random()<.5)G.parts.push({x:b.x,y:b.y,vx:0,vy:0,l:.25,m:.25,c:'#9ff0e6',r:2});}
  b.x+=b.vx*dt;b.y+=b.vy*dt;
 }
 // enemies
 for(const e of G.en){e.t+=dt;if(e.flash>0)e.flash-=dt;
  if(e.type==='dart'){e.x+=e.vx*dt;e.y+=e.vy*dt;e.fire-=dt;if(e.fire<=0&&!e.shot&&e.y>20){e.shot=1;eShot(e.x,e.y,aimAt(e.x,e.y),170+10*G.si);}}
  else if(e.type==='weaver'){e.y+=75*dt;e.x=e.x0+Math.sin(e.t*2+e.ph)*85;e.fire-=dt;if(G.si>=1&&e.fire<=0&&e.y>20){e.fire=2.2;eShot(e.x,e.y,Math.PI/2,160+10*G.si);}}
  else if(e.type==='turret'){e.y+=60*dt;e.ang=aimAt(e.x,e.y);e.fire-=dt;if(e.fire<=0&&e.y>10){e.fire=Math.max(.9,1.7-.12*G.si);eShot(e.x+Math.cos(e.ang)*16,e.y+Math.sin(e.ang)*16,e.ang,170+10*G.si);}}
  else if(e.type==='heavy'){if(e.t<8){e.y+=(e.ty-e.y)*1.5*dt;e.x+=Math.sin(e.t)*30*dt;}else e.y+=90*dt;e.fire-=dt;
   if(e.fire<=0&&e.y>30){e.fire=Math.max(1.1,1.9-.12*G.si);const a=aimAt(e.x,e.y),n=3+Math.min(4,G.si);for(let i=0;i<n;i++)eShot(e.x,e.y+20,a+(i-(n-1)/2)*.18,150+8*G.si);}}
  if(alive&&(e.x-p.x)**2+(e.y-p.y)**2<(e.r+10)**2){e.hp-=5;hurtPlayer(20);}
 }
 // boss
 const B=G.boss;
 if(B&&!B.dead){B.t+=dt;if(B.flash>0)B.flash-=dt;
  if(B.y<130)B.y+=60*dt;else{B.x=W/2+Math.sin(B.t*.6)*90;B.pt-=dt;
   if(B.pt<=0){const s=G.si,spd=150+10*s;
    if(B.pat===0){B.pt=.14;const a=B.t*2.3;for(let k=0;k<3+Math.floor(s/2);k++)eShot(B.x,B.y+20,a+k*(Math.PI*2/(3+Math.floor(s/2))),spd*.85);}
    else if(B.pat===1){B.pt=.7;const a=aimAt(B.x,B.y);for(let i=-2;i<=2;i++)eShot(B.x,B.y+30,a+i*.15,spd*1.15);}
    else{B.pt=1.1;const n=14+s*2;for(let i=0;i<n;i++)eShot(B.x,B.y,i*Math.PI*2/n+B.t,spd*.9);}
    }
   if(B.t>6&&Math.floor(B.t/6)!==Math.floor((B.t-dt)/6))B.pat=(B.pat+1)%3;}
  if(alive&&Math.abs(B.x-p.x)<80&&Math.abs(B.y-p.y)<45)hurtPlayer(25);
 }
 // hits
 for(const b of G.pb){if(b.dead)continue;
  for(const e of G.en){if(e.hp>0&&(e.x-b.x)**2+(e.y-b.y)**2<(e.r+4)**2){e.hp-=b.d;e.flash=.06;b.dead=1;break;}}
  if(!b.dead&&B&&!B.dead&&B.y>0&&Math.abs(b.x-B.x)<85&&Math.abs(b.y-B.y)<50){B.hp-=b.d;B.flash=.05;b.dead=1;if(Math.random()<.2)boom(b.x,b.y,2,'#ffe2a8',60);}}
 for(const e of G.en)if(e.hp<=0&&!e.dead){e.dead=1;G.killed++;boom(e.x,e.y,e.type==='heavy'?36:16);dropGears(e.x,e.y,e.g);G.shake=Math.max(G.shake,e.type==='heavy'?.25:.08);}
 if(B&&!B.dead&&B.hp<=0){B.dead=1;G.killed++;G.spawned++;for(let i=0;i<6;i++)boom(B.x+rnd(-70,70),B.y+rnd(-40,40),24);dropGears(B.x,B.y,30+G.si*5);G.eb=[];G.shake=.8;G.flash=.4;G.endT=3;G.win=true;}
 G.pb=G.pb.filter(b=>!b.dead&&b.y>-30&&b.y<H+30&&b.x>-30&&b.x<W+30);
 G.en=G.en.filter(e=>!e.dead&&e.y<H+60&&e.x>-80&&e.x<W+80);
 // enemy bullets
 for(const b of G.eb){b.x+=b.vx*dt;b.y+=b.vy*dt;if(alive&&(b.x-p.x)**2+(b.y-p.y)**2<81){b.dead=1;hurtPlayer(12+2*G.si);}}
 G.eb=G.eb.filter(b=>!b.dead&&b.y>-20&&b.y<H+20&&b.x>-20&&b.x<W+20);
 // gears
 const mr=40+28*L.magnet;
 for(const g of G.gears){const dx=p.x-g.x,dy=p.y-g.y,d=Math.hypot(dx,dy);
  if(alive&&(d<mr||G.endT>=0&&G.win)){g.vx=dx/d*460;g.vy=dy/d*460;}else{g.vx*=.96;g.vy=g.vy*.96+60*dt*3;}
  g.x+=g.vx*dt;g.y+=g.vy*dt;if(alive&&d<18){g.dead=1;G.earned+=g.v;updHud();}}
 G.gears=G.gears.filter(g=>!g.dead&&g.y<H+20);
 for(const q of G.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.94;q.vy*=.94;q.l-=dt;}
 G.parts=G.parts.filter(q=>q.l>0);
 if(G.endT>=0){G.endT-=dt;if(G.endT<0)finish();}
}

// ---------- drawing ----------
function drawPlayer(x,y,t,blink){if(blink)return;cx.save();cx.translate(x,y);
 const f=9+Math.sin(t*45)*3;cx.fillStyle='#ffd27a';cx.beginPath();cx.moveTo(-5,16);cx.lineTo(0,16+f);cx.lineTo(5,16);cx.fill();
 cx.fillStyle='rgba(0,0,0,.25)';cx.beginPath();cx.ellipse(10,24,16,6,0,0,7);cx.fill();
 cx.fillStyle='#1e8f86';cx.beginPath();cx.moveTo(0,-14);cx.lineTo(24,8);cx.lineTo(23,14);cx.lineTo(6,10);cx.lineTo(-6,10);cx.lineTo(-23,14);cx.lineTo(-24,8);cx.closePath();cx.fill();
 cx.fillStyle='#2bb3a8';cx.beginPath();cx.moveTo(0,-14);cx.lineTo(22,8);cx.lineTo(6,6);cx.lineTo(-6,6);cx.lineTo(-22,8);cx.closePath();cx.fill();
 cx.fillStyle='#1e8f86';cx.beginPath();cx.moveTo(-4,10);cx.lineTo(-11,20);cx.lineTo(-3,18);cx.moveTo(4,10);cx.lineTo(11,20);cx.lineTo(3,18);cx.fill();
 cx.fillStyle='#eef3f6';cx.beginPath();cx.moveTo(0,-28);cx.lineTo(5,-10);cx.lineTo(5,16);cx.lineTo(-5,16);cx.lineTo(-5,-10);cx.closePath();cx.fill();
 cx.fillStyle='#ff9d2e';cx.beginPath();cx.ellipse(0,-11,2.6,6,0,0,7);cx.fill();
 cx.fillStyle='#ff9d2e';cx.fillRect(-21,9,4,3);cx.fillRect(17,9,4,3);
 cx.restore();}
function drawEnemy(e){cx.save();cx.translate(e.x,e.y);const hit=e.flash>0;
 if(e.type==='dart'){cx.fillStyle=hit?'#fff':'#c2263f';cx.beginPath();cx.moveTo(0,16);cx.lineTo(13,-10);cx.lineTo(0,-4);cx.lineTo(-13,-10);cx.closePath();cx.fill();cx.fillStyle='#ffd0d8';cx.fillRect(-2,0,4,6);}
 else if(e.type==='weaver'){cx.rotate(e.t*3);cx.fillStyle=hit?'#fff':'#7b3fbf';for(let i=0;i<3;i++){cx.rotate(Math.PI*2/3);cx.fillRect(-3,-17,6,12);}cx.beginPath();cx.arc(0,0,9,0,7);cx.fill();cx.fillStyle='#e7c6ff';cx.beginPath();cx.arc(0,0,4,0,7);cx.fill();}
 else if(e.type==='turret'){cx.fillStyle='rgba(0,0,0,.3)';cx.beginPath();cx.arc(3,3,17,0,7);cx.fill();cx.fillStyle=hit?'#fff':'#5a5f66';cx.beginPath();cx.arc(0,0,17,0,7);cx.fill();cx.fillStyle='#8a2234';cx.beginPath();cx.arc(0,0,10,0,7);cx.fill();cx.rotate(e.ang);cx.fillStyle='#2b2f35';cx.fillRect(4,-3,16,6);}
 else{cx.fillStyle='rgba(0,0,0,.25)';cx.fillRect(-26,-6,60,40);cx.fillStyle=hit?'#fff':'#3d5a3a';cx.beginPath();cx.moveTo(-34,-10);cx.lineTo(34,-10);cx.lineTo(24,18);cx.lineTo(8,26);cx.lineTo(-8,26);cx.lineTo(-24,18);cx.closePath();cx.fill();cx.fillStyle='#c2263f';cx.fillRect(-28,-14,10,8);cx.fillRect(18,-14,10,8);cx.fillStyle='#ffb347';cx.beginPath();cx.arc(0,8,5,0,7);cx.fill();}
 cx.restore();}
function drawBoss(B){cx.save();cx.translate(B.x,B.y);const hit=B.flash>0;
 cx.fillStyle='rgba(0,0,0,.3)';cx.beginPath();cx.ellipse(14,20,95,50,0,0,7);cx.fill();
 cx.fillStyle=hit?'#ffffff':'#2a2f3a';cx.beginPath();cx.moveTo(-90,-30);cx.lineTo(90,-30);cx.lineTo(70,20);cx.lineTo(30,48);cx.lineTo(-30,48);cx.lineTo(-70,20);cx.closePath();cx.fill();
 cx.fillStyle='#8a2234';cx.fillRect(-80,-38,40,14);cx.fillRect(40,-38,40,14);
 cx.fillStyle='#454c5a';cx.fillRect(-50,-20,100,30);
 const pulse=.6+.4*Math.sin(B.t*6);cx.fillStyle=`rgba(255,157,46,${pulse})`;cx.beginPath();cx.arc(0,10,14,0,7);cx.fill();
 cx.fillStyle='#ffe2a8';cx.beginPath();cx.arc(0,10,6,0,7);cx.fill();
 for(const s of[-1,1]){cx.fillStyle='#5a5f66';cx.beginPath();cx.arc(s*55,10,11,0,7);cx.fill();cx.fillStyle='#1b1f26';cx.fillRect(s*55-3,10,6,16);}
 cx.restore();
 if(B.y>0){cx.fillStyle='rgba(0,0,0,.4)';cx.fillRect(40,44,W-80,6);cx.fillStyle='#ff4d6d';cx.fillRect(40,44,(W-80)*Math.max(0,B.hp/B.max),6);}}
function drawGear(g,t){cx.save();cx.translate(g.x,g.y);cx.rotate(t*3);cx.fillStyle='#ff9d2e';for(let i=0;i<6;i++){cx.rotate(Math.PI/3);cx.fillRect(-1.5,-7,3,4);}cx.beginPath();cx.arc(0,0,5,0,7);cx.fill();cx.fillStyle='#5a2a00';cx.beginPath();cx.arc(0,0,2,0,7);cx.fill();cx.restore();}

function render(){
 cx.setTransform(scale,0,0,scale,0,0);
 if(G&&G.shake>0)cx.translate(rnd(-4,4)*G.shake*2,rnd(-4,4)*G.shake*2);
 drawBg();
 if(G&&(state==='play'||state==='pause'||state==='result')){
  for(const e of G.en)if(e.type==='turret')drawEnemy(e);
  for(const g of G.gears)drawGear(g,G.t);
  for(const e of G.en)if(e.type!=='turret')drawEnemy(e);
  if(G.boss&&!G.boss.dead)drawBoss(G.boss);
  for(const b of G.pb){if(b.k==='m'){cx.fillStyle='#9ff0e6';cx.beginPath();cx.arc(b.x,b.y,3.5,0,7);cx.fill();}
   else{cx.fillStyle=b.k==='w'?'#9ff0e6':'#ffd27a';cx.fillRect(b.x-1.5,b.y-8,3,14);cx.fillStyle='#fff';cx.fillRect(b.x-.7,b.y-7,1.4,8);}}
  if(G.p.hp>0)drawPlayer(G.p.x,G.p.y,G.t,G.p.inv>0&&Math.floor(G.t*20)%2===0);
  for(const q of G.parts){cx.globalAlpha=Math.max(0,q.l/q.m);cx.fillStyle=q.c;cx.beginPath();cx.arc(q.x,q.y,q.r,0,7);cx.fill();}cx.globalAlpha=1;
  for(const b of G.eb){cx.fillStyle='#ff4d6d';cx.beginPath();cx.arc(b.x,b.y,5.5,0,7);cx.fill();cx.fillStyle='#fff';cx.beginPath();cx.arc(b.x,b.y,2.4,0,7);cx.fill();}
  if(save.god){cx.strokeStyle='rgba(43,179,168,.5)';cx.lineWidth=2;cx.beginPath();cx.arc(G.p.x,G.p.y,30,0,7);cx.stroke();}
  if(G.flash>0){cx.fillStyle=`rgba(255,255,255,${G.flash})`;cx.fillRect(-10,-10,W+20,H+20);}
  if(G.t<2.5){cx.globalAlpha=Math.min(1,(2.5-G.t)*1.5);cx.fillStyle='#eef3f6';cx.font='22px Bungee, Impact, sans-serif';cx.textAlign='center';cx.fillText(STAGES[G.si].name.toUpperCase(),W/2,H*.42);cx.font='600 13px "Chakra Petch", sans-serif';cx.fillText('STAGE '+(G.si+1),W/2,H*.42-30);cx.globalAlpha=1;}
  if(G.bossSpawned&&G.boss&&G.boss.t<2&&!G.boss.dead){cx.fillStyle=`rgba(255,77,109,${.5+.5*Math.sin(G.boss.t*12)})`;cx.font='20px Bungee, Impact, sans-serif';cx.textAlign='center';cx.fillText('WARNING',W/2,H*.45);}
 }
}

// ---------- loop ----------
let last=performance.now();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;
 if(state==='play'&&G)update(dt);else if(state==='menu'||state==='hangar')stepBg(dt,40);
 render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// ---------- HUD & screens ----------
function updHud(){if(!G)return;$('hp').style.width=(G.p.hp/G.p.max*100)+'%';$('hp').style.background=G.p.hp/G.p.max<.3?'var(--danger)':'var(--teal)';$('hudG').textContent=fmt(G.earned);$('bombN').textContent=G.bombs;}
function finish(){
 const si=G.si,pct=G.spawned?G.killed/G.spawned:0,got=[],m=save.medals[si]||{};let bonus=0;
 if(G.win){got.push('clear');if(G.hits===0)got.push('untouched');if(pct>=.9)got.push('hunter');
  if(si+1>=save.unlocked&&si+1<STAGES.length)save.unlocked=si+2;}
 const fresh=got.filter(k=>!m[k]);fresh.forEach(k=>{m[k]=1;bonus+=100*(si+1);});save.medals[si]=m;
 save.gears+=G.earned+bonus;store();
 $('resTitle').textContent=G.win?'Stage clear':'Shot down';
 $('resG').textContent=fmt(G.earned)+(bonus?' + '+fmt(bonus)+' medal bonus':'');
 $('resK').textContent=Math.round(pct*100)+'%';
 $('resMedals').innerHTML=MEDALS.map(([k,l])=>`<div class="medal ${m[k]?'got':''} ${fresh.includes(k)?'new':''}">${m[k]?'★':'☆'} ${l}</div>`).join('');
 const next=G.win&&si+1<STAGES.length;$('resNext').textContent=next?'Next stage':'Fly again';
 $('resNext').onclick=()=>startRun(next?si+1:si);
 state='result';show('result');
}
function renderMenu(){
 $('bankG').textContent=fmt(save.gears);
 $('stageList').innerHTML=STAGES.map((s,i)=>{const m=save.medals[i]||{},lock=i>=save.unlocked;
  return `<button class="stage" data-s="${i}" ${lock?'disabled':''}><small>Stage ${i+1}</small>${s.name}<span class="badges">${MEDALS.map(([k])=>m[k]?'★':'☆').join('')}</span></button>`}).join('');
 $('stageList').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>startRun(+b.dataset.s));
}
function renderHangar(){
 $('bankG2').textContent=fmt(save.gears);
 $('upList').innerHTML=UP.map(u=>{const l=save.lv[u.k],max=l>=MAXL,c=cost(u,l);
  return `<div class="up"><b>${u.name}</b><p>${u.desc}</p><div class="pips">${Array.from({length:MAXL},(_,i)=>`<i class="${i<l?'on':''}"></i>`).join('')}</div>
  <button data-u="${u.k}" ${max||save.gears<c?'disabled':''}>${max?'MAX':'<i class="cog" style="display:inline-block;width:12px;height:12px;vertical-align:-1px"></i> '+fmt(c)}</button></div>`}).join('');
 $('upList').querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const u=UP.find(x=>x.k===b.dataset.u),c=cost(u,save.lv[u.k]);if(save.gears>=c&&save.lv[u.k]<MAXL){save.gears-=c;save.lv[u.k]++;store();renderHangar();}});
 $('wGod').textContent='Invincible: '+(save.god?'on':'off');$('wGod').classList.toggle('on',save.god);
}
function goMenu(){state='menu';setBg(Math.min(save.unlocked-1,STAGES.length-1));renderMenu();show('menu');}
function goHangar(){state='hangar';renderHangar();show('hangar');}

$('toHangar').onclick=goHangar;$('hangarBack').onclick=goMenu;$('resHangar').onclick=goHangar;$('resMenu').onclick=goMenu;
$('wGears').onclick=()=>{save.gears+=10000;store();renderHangar();};
$('wMax').onclick=()=>{UP.forEach(u=>save.lv[u.k]=MAXL);store();renderHangar();};
$('wUnlock').onclick=()=>{save.unlocked=STAGES.length;store();$('wUnlock').textContent='All stages open';};
$('wGod').onclick=()=>{save.god=!save.god;store();renderHangar();};
let resetArm=0;$('wReset').onclick=()=>{if(!resetArm){resetArm=1;$('wReset').textContent='Tap again to wipe everything';setTimeout(()=>{resetArm=0;$('wReset').textContent='Reset all progress';},3000);return;}save=fresh();store();resetArm=0;$('wReset').textContent='Reset all progress';renderHangar();};
$('pauseBtn').onclick=()=>{if(state==='play'){state='pause';show('pause');}};
$('resume').onclick=()=>{state='play';show('play');last=performance.now();};
$('quit').onclick=()=>{G.win=false;finish();};
$('bombBtn').onclick=bomb;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'){state='pause';show('pause');}});

// ---------- input ----------
let drag=null;
function gp(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cv.addEventListener('pointerdown',e=>{if(state!=='play')return;drag=gp(e);cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!drag||state!=='play')return;const q=gp(e);G.p.x=Math.max(18,Math.min(W-18,G.p.x+(q.x-drag.x)*1.2));G.p.y=Math.max(60,Math.min(H-30,G.p.y+(q.y-drag.y)*1.2));drag=q;});
const endDrag=()=>drag=null;cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();bomb();}if(e.key==='Escape'&&state==='play'){state='pause';show('pause');}});
addEventListener('keyup',e=>keys[e.key]=false);

goMenu();
})();
</script>
