name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/**'
      - 'icons/**'
      - 'art/**'
      - 'tools/**'
      - 'version.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check version numbers match
        run: |
          page=$(grep -oP 'const BUILD=\K[0-9]+' index.html)
          json=$(python3 -c "import json;print(json.load(open('version.json'))['build'])")
          echo "index.html BUILD=$page  version.json build=$json"
          test "$page" = "$json"

      - name: Bundle the game
        run: |
          mkdir -p app/www
          cp index.html manifest.webmanifest version.json app/www/
          cp -r js app/www/
          cp -r icons app/www/
          if [ -d art ]; then cp -r art app/www/; fi
          # bundle three.js inside the APK so the game works offline
          (cd app && npm init -y > /dev/null && npm install --no-audit --no-fund three@0.128.0)
          cp app/node_modules/three/build/three.min.js app/www/three.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' app/www/index.html
          grep -q 'src="three.min.js"' app/www/index.html
          echo "VERSION_NAME=$(python3 -c "import json;print(json.load(open('version.json'))['version'])")" >> "$GITHUB_ENV"

      - name: Create the Capacitor Android project
        working-directory: app
        run: |
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          # androidScheme/hostname pinned to Capacitor's defaults so the save (localStorage origin) survives future upgrades
          echo '{"appId":"com.rexraja.skyfire","appName":"Skyfire Squadron","webDir":"www","server":{"androidScheme":"https","hostname":"localhost"},"android":{"backgroundColor":"#0a1220"}}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Icon, splash, fullscreen and version
        run: |
          pip install --quiet pillow
          python3 tools/android_patch.py app/android "${{ github.run_number }}" "${VERSION_NAME}.${{ github.run_number }}"

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../../Skyfire-Squadron.apk

      - name: Check the APK is signed with the committed key
        run: |
          # The installed app only accepts updates signed with this exact key. Never replace tools/debug.keystore.
          expected=63:86:B6:10:66:0E:F9:AB:79:D6:5C:89:5F:E8:EC:9E:60:7B:B4:0D:3A:20:90:B3:7C:76:15:5F:34:7E:19:95
          want=$(keytool -list -v -keystore tools/debug.keystore -storepass android | grep -m1 'SHA256:' | awk '{print $2}')
          got=$(keytool -printcert -jarfile Skyfire-Squadron.apk | grep -m1 'SHA256:' | awk '{print $2}')
          echo "expected: $expected"
          echo "keystore: $want"
          echo "apk:      $got"
          test "$want" = "$expected" && test "$got" = "$expected"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Skyfire Squadron ${{ env.VERSION_NAME }} (build ${{ github.run_number }})
          body: |
            Install on Android: open this page on your phone, tap **Skyfire-Squadron.apk**, then allow "Install unknown apps" for your browser if asked.
            Permanent link to the newest build: https://github.com/rexraja89-oss/skyfire/releases/latest/download/Skyfire-Squadron.apk
          files: Skyfire-Squadron.apk
          make_latest: true
